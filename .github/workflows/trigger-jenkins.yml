name: Trigger Jenkins Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Pipeline
        run: |
          CRUMB=$(curl -s \
            "${{ secrets.JENKINS_URL }}/crumbIssuer/api/json" \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['crumb'])")

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.JENKINS_URL }}/job/${{ secrets.JENKINS_JOB_NAME }}/build" \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            -H "Jenkins-Crumb: $CRUMB")

          echo "Jenkins responded with HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to trigger Jenkins build"
            exit 1
          fi
          echo "Jenkins build triggered for ${{ secrets.JENKINS_JOB_NAME }}"

      - name: Log trigger info
        run: |
          echo "Triggered by : ${{ github.actor }}"
          echo "Branch       : ${{ github.ref_name }}"
          echo "Commit       : ${{ github.sha }}"
          echo "Monitor anomalies in Argus Agent dashboard"
